# Development stack: db + backend + frontend (hot reload)
# Run: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recruitflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recruitflow_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-recruitflow}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recruitflow} -d ${POSTGRES_DB:-recruitflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: dev
      DEBUG: "true"
      POSTGRES_USER: ${POSTGRES_USER:-recruitflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recruitflow_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-recruitflow}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-key-change-me-0123456789abcdef}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /data/uploads
    volumes:
      - ./backend:/app
      - uploads_dev:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata_dev:
  uploads_dev:
