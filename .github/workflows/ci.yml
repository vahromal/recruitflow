name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recruitflow
          POSTGRES_PASSWORD: recruitflow_dev_password
          POSTGRES_DB: recruitflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recruitflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: recruitflow
      POSTGRES_PASSWORD: recruitflow_dev_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run tests (creates test DB + applies migrations)
        working-directory: backend
        run: python -m pytest -q
      - name: Verify migrations on a clean database
        working-directory: backend
        run: |
          createdb -h localhost -U recruitflow clean_check || true
          POSTGRES_DB=clean_check alembic upgrade head

  frontend-build:
    name: Frontend typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci || npm install
      - name: Typecheck + build
        working-directory: frontend
        run: npm run build
      - name: Tests
        working-directory: frontend
        run: npm test

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t recruitflow-backend:${{ github.sha }} ./backend
      - name: Build frontend image
        run: docker build -t recruitflow-frontend:${{ github.sha }} ./frontend

  # Optional deploy: add repository secrets HOST, USER, SSH_KEY and DOMAIN.
  deploy:
    name: Deploy over SSH (manual)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [docker-build]
    environment: production
    continue-on-error: true
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/RecruitFlow
            git pull --ff-only
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml exec -T backend alembic upgrade head
            curl -fsS https://${{ secrets.DOMAIN }}/health
